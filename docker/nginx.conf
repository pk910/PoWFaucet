server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    root /app/static;
    index index.seo.html index.html;
    charset utf-8;
    access_log off;

    # The index page names the build, and the build's files are content-hashed
    # (`powfaucet.71f07e37.js`). This pair is what makes a deploy visible: the page is never
    # cached, everything it names can be cached forever. Without it a fixed name served with
    # only Last-Modified gets heuristic freshness - often hours - and a browser goes on
    # running the previous deploy until someone reloads hard.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }
    location = / {
        add_header Cache-Control "no-cache" always;
    }

    # wasm modules ship with precompressed siblings; hand those out rather than
    # recompressing. No `brotli_static` here: the stock nginx image has no ngx_brotli and an
    # unknown directive stops it from starting at all - a faucet that will not boot is worse
    # than one that sends 92 KB of gzip instead of 76 KB of brotli.
    location /js/ {
        gzip_static on;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8082/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8082/api/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # a custom module's client files are served by the faucet out of the installed module, not
    # from the static root; `^~` so no regex location above can capture them
    location ^~ /modules/ {
        proxy_pass http://127.0.0.1:8082/modules/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
