version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      "Server dependencies":
        patterns:
          - "*"
    ignore:
      # viem 3 is in pre-release; the move is a deliberate migration of src/eth/rpc, not a bump
      - dependency-name: "viem"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/faucet-client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      "Client dependencies":
        patterns:
          - "*"
  # the workflows pin every action to a commit sha; dependabot moves the sha and the version comment
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      "GitHub Actions":
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # the Node major is a coordinated change: Dockerfile, workflow node-version, pkg targets
      # and engines move together to the next LTS line, not to every odd release
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
