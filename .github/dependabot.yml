version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      "Server dependencies":
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/faucet-client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      "Client dependencies":
        patterns:
          - "*"
  # the workflows pin every action to a commit sha; dependabot moves the sha and the version comment
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      "GitHub Actions":
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
