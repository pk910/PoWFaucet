name: Build docker image for latest release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Get project versions
        id: version
        run: |
          echo "server_version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "client_version=$(jq -r .version faucet-client/package.json)" >> "$GITHUB_OUTPUT"
      - name: Build and push multi-arch images
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile \
            --tag pk910/powfaucet:v${{ steps.version.outputs.server_version }} \
            --tag pk910/powfaucet:v2-stable \
            --push .
